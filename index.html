<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Bees — Production Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Questrial&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20,400,0..1&display=block" rel="stylesheet">
<style>
:root{
/* Design Bees brand */
--gold:#F6BE38; --gold-deep:#E0A81C; --cream:#F3EFD6; --ink:#15150F; --ink-soft:#282B30;
/* Surfaces */
--bg:#FAF7EC; --card-bg:#fff; --border:#EAE3D0; --border-strong:#DED5BD;
--shadow:0 1px 2px rgba(21,21,15,.04), 0 6px 18px -12px rgba(21,21,15,.16);
--shadow-lift:0 2px 4px rgba(21,21,15,.05), 0 18px 32px -16px rgba(21,21,15,.22);
/* Text */
--text:#15150F; --muted:#6E6550;
/* Status inks (names kept — the view code passes these as CSS vars) */
--purple:#8A5B12; --purple-lt:#FAEFD4;
--green:#4D7B1B; --green-lt:#EBF2DC;
--amber:#8A5D00; --amber-lt:#FCF0D2;
--blue:#26685F; --blue-lt:#E3F0ED;
--red:#A8362B; --red-lt:#FBE6E2;
--gray-lt:#F1EDE1;
--font-ui:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
--font-body:'Questrial',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--purple);text-decoration:none}
a:hover{color:var(--ink)}

/* ---------- Header ---------- */
.hdr{background:var(--ink);color:#fff;position:sticky;top:0;z-index:50;padding:14px 24px 0;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.hdr-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:none}
.brand-logo{height:22px;width:auto;display:block;flex:none}
.brand-rule{width:1px;height:18px;background:rgba(255,255,255,.18);flex:none}
.hdr h1{font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap;color:rgba(255,255,255,.72)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-bottom:7px}
.refresh-info{font-family:var(--font-body);font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap}
.stale-ctl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.6);white-space:nowrap;cursor:help}
.stale-ctl input{width:46px;padding:5px 6px;border:1px solid rgba(255,255,255,.16);border-radius:7px;background:rgba(255,255,255,.07);color:#fff;font-family:var(--font-ui);font-size:12px;font-weight:600;text-align:center}
.stale-ctl input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.12)}
.client-search{flex:none;width:196px;padding:8px 13px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.07);color:#fff;font-family:var(--font-ui);font-size:12.5px;text-overflow:ellipsis}
.client-search::placeholder{color:rgba(255,255,255,.62)}
.client-search:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.12)}
.refresh-btn{padding:8px 14px;border-radius:8px;border:1px solid transparent;background:var(--gold);color:var(--ink);cursor:pointer;font-family:var(--font-ui);font-size:12.5px;font-weight:600;transition:background .15s,opacity .15s}
.refresh-btn:hover{background:var(--gold-deep)}
.refresh-btn.spin{opacity:.5;pointer-events:none}
.refresh-btn.spin::before{content:'';display:inline-block;width:10px;height:10px;margin-right:7px;border:2px solid rgba(21,21,15,.3);border-top-color:var(--ink);border-radius:50%;vertical-align:-1px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#clearSearchBtn{background:transparent;border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.75)}
#clearSearchBtn:hover{background:rgba(255,255,255,.08);color:#fff}

/* ---------- Tabs ---------- */
.tabs{display:flex;align-items:flex-end;column-gap:2px;row-gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs+.tabs{margin-top:2px}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:none;border-radius:8px 8px 0 0;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-family:var(--font-ui);font-size:12.5px;font-weight:500;transition:background .15s,color .15s;white-space:nowrap;position:relative;top:1px}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab.on{background:var(--bg);color:var(--text);font-weight:600}
.mi{font-family:'Material Symbols Outlined';font-size:17px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'opsz' 20;flex:none;width:17px;overflow:hidden}
.tab .mi{color:var(--gold);opacity:.85}
.tab.on .mi{color:var(--gold-deep);opacity:1;font-variation-settings:'FILL' 1,'wght' 500,'opsz' 20}

/* ---------- Layout ---------- */
.wrap{padding:28px 24px 72px;max-width:1440px;margin:0 auto}
.view-title{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:4px}
.view-sub{font-family:var(--font-body);font-size:13.5px;color:var(--muted);margin-bottom:26px;max-width:72ch;line-height:1.5}
.loading{text-align:center;padding:72px;color:var(--muted);font-family:var(--font-body);font-size:13.5px}
.empty{padding:22px;color:var(--muted);font-family:var(--font-body);font-size:13px;background:rgba(243,239,214,.5);border:1px dashed var(--border-strong);border-radius:12px}

/* ---------- Sections ---------- */
.section{margin-bottom:34px}
.section-hdr{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.section-hdr h3{font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.section-count{font-size:11px;font-weight:600;color:var(--muted);background:var(--gray-lt);padding:2px 9px;border-radius:20px;margin-left:-2px}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:14px}
.card{background:var(--card-bg);border:1px solid var(--border);border-left:3px solid var(--border-strong);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:11px;transition:box-shadow .18s,transform .18s}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.card.status-working{border-left-color:var(--green)}
.card.status-assigned{border-left-color:var(--gold)}
.card.status-review{border-left-color:var(--blue)}
.card.status-prep{border-left-color:var(--purple)}
.card.status-pushed{border-left-color:#B8B0A0}
.card.status-client{border-left-color:var(--red)}
.card-title{font-size:13.5px;font-weight:600;line-height:1.4;text-wrap:pretty}
.card-title a{color:var(--text)}
.card-title a:hover{color:var(--purple);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:2px}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.chip.client{background:var(--purple-lt);color:var(--purple);box-shadow:inset 0 0 0 1px rgba(138,91,18,.12)}
.chip.list{background:var(--gray-lt);color:var(--muted)}
.chip.due{background:var(--amber-lt);color:var(--amber)}
.chip.due.overdue{background:var(--red-lt);color:var(--red)}
.card-members{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.member{display:flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:11.5px;color:var(--muted);background:var(--gray-lt);padding:3px 10px 3px 3px;border-radius:20px}
.avatar{width:19px;height:19px;border-radius:50%;background:var(--cream);color:var(--purple);font-family:var(--font-ui);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;object-fit:cover;flex:none}

/* ---------- Setup (unused fallback screen) ---------- */
.setup{max-width:520px;margin:80px auto;background:#fff;border:1px solid var(--border);border-radius:14px;padding:32px;box-shadow:var(--shadow)}
.setup h2{font-size:19px;margin-bottom:6px}
.setup p,.setup .note{font-family:var(--font-body);color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.55}
.setup label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
.setup input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-ui);font-size:13px}
.setup button{margin-top:20px;width:100%;padding:12px;border-radius:8px;border:none;background:var(--gold);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;font-weight:700;cursor:pointer}
.setup button:hover{background:var(--gold-deep)}
.setup .err{color:var(--red);font-size:12.5px;margin-top:10px;display:none}

@media(max-width:760px){
.hdr{padding:12px 16px 0}
.hdr-right,.hdr-tools{margin-left:0;width:100%;padding-bottom:2px}
.client-search{width:100%}
.tabs{row-gap:8px}
.wrap{padding:22px 16px 60px}
.grid{grid-template-columns:1fr}
}
</style>
</head>

// Cloudflare Worker proxy that holds the Trello key/token server-side.
// Update this after deploying trello-proxy-worker.js.
const PROXY_BASE_URL = 'https://trello-dashboard-proxy.aj-9cf.workers.dev';

const REFRESH_MS = 60000;
const DEFAULT_STALE_DAYS = 2;

let currentView = 'working';
let cache = {};
let labelMap = {};
let refreshTimer = null;
let staleDays = DEFAULT_STALE_DAYS;
let searchQuery = '';

function loadStaleDays() {
  const raw = localStorage.getItem('trelloDashStaleDays');
  staleDays = raw ? Number(raw) || DEFAULT_STALE_DAYS : DEFAULT_STALE_DAYS;
  const el = document.getElementById('staleDays');
  if (el) el.value = staleDays;
}

function setStaleDays(v) {
  staleDays = Number(v) || DEFAULT_STALE_DAYS;
  localStorage.setItem('trelloDashStaleDays', String(staleDays));
  render();
}

function api(path, params) {
  const url = new URL(`${PROXY_BASE_URL}${path}`);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  return fetch(url).then(r => {
    if (!r.ok) throw new Error(`Proxy error ${r.status}`);
    return r.json();
  });
}

function initials(name) {
  return name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
}

function isStale(card) {
  if (!card.dateLastActivity) return false;
  const ageDays = (Date.now() - new Date(card.dateLastActivity).getTime()) / 86400000;
  return ageDays > staleDays;
}

function filterCards(cards) {
  // Client/email exclusions are applied server-side in the Worker proxy —
  // this only applies the user-visible, per-browser staleness cutoff.
  return (cards || []).filter(c => !isStale(c));
}

  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  try {
    const [labels, ...cardLists] = await Promise.all([
      api(`/board/labels`, { fields: 'name,color', limit: 1000 }),
      ...Object.entries(ALL_LISTS).map(([key, l]) =>
        api(`/list/${l.id}/cards`, {
          fields: 'name,due,dueComplete,idLabels,shortUrl,dateLastActivity',
          members: 'true',
          member_fields: 'fullName,avatarUrl',
        }).then(cards => [key, cards])
      ),
    ]);
    labelMap = {};
    labels.forEach(l => { if (l.name) labelMap[l.id] = l; });
    populateLabelOptions();
    cache = Object.fromEntries(cardLists);
    document.getElementById('refreshInfo').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty">Couldn't reach the data proxy: ${e.message}. Try refreshing in a minute — if it persists, the proxy may need redeploying.</div>`;
  } finally {
    btn.classList.remove('spin');
  }
}

function clientChip(card) {
  const label = (card.idLabels || []).map(id => labelMap[id]).find(Boolean);
  return label ? `<span class="chip client">${escapeHtml(label.name)}</span>` : '';
}

function dueChip(card) {
  if (!card.due) return '';
  const d = new Date(card.due);
  const overdue = !card.dueComplete && d < new Date();
  return `<span class="chip due${overdue ? ' overdue' : ''}">${overdue ? 'Overdue: ' : 'Due '}${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>`;
}

function membersHtml(card) {
  if (!card.members || !card.members.length) return '';
  return `<div class="card-members">${card.members.map(m => `
    <span class="member">
      ${m.avatarUrl ? `<img class="avatar" src="${m.avatarUrl}/30.png" alt="">` : `<span class="avatar">${initials(m.fullName)}</span>`}
      ${escapeHtml(m.fullName)}
    </span>`).join('')}</div>`;
}

function cardHtml(card, statusClass, listLabel) {
  return `<div class="card status-${statusClass}">
    <div class="card-title"><a href="${card.shortUrl}" target="_blank" rel="noopener">${escapeHtml(card.name)}</a></div>
    <div class="card-meta">
      ${clientChip(card)}
      ${listLabel ? `<span class="chip list">${escapeHtml(listLabel)}</span>` : ''}
      ${dueChip(card)}
    </div>
    ${membersHtml(card)}
  </div>`;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function section(title, dotColor, cards, statusClass, listLabel) {
  cards = filterCards(cards);
  const body = cards.length
    ? `<div class="grid">${cards.map(c => cardHtml(c, statusClass, listLabel)).join('')}</div>`
    : `<div class="empty">Nothing here right now.</div>`;
  return `<div class="section">
    <div class="section-hdr">
      <span class="section-dot" style="background:${dotColor}"></span>
      <h3>${title}</h3>
      <span class="section-count">${cards.length}</span>
    </div>
    ${body}
  </div>`;
}

const VIEWS = {
  working: () => {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Currently being worked on</div>
       <div class="view-sub">Live from "${LISTS.working.name}" — designers actively on these jobs right now.</div>` +
      section('In progress', 'var(--green)', cache.working, 'working');
  },
  assigned: () => {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Assigned for today</div>
       <div class="view-sub">Live from "${LISTS.assigned.name}" — queued up for the designer, not yet started.</div>` +
      section('Assigned, not started', 'var(--amber)', cache.assigned, 'assigned');
  },
  combined: () => {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Working + Assigned</div>
       <div class="view-sub">Everything designers have on their plate today, split by whether it's actively in progress.</div>` +
      section('🟢 Currently being worked on', 'var(--green)', cache.working, 'working') +
      section('🟠 Assigned for today, not started', 'var(--amber)', cache.assigned, 'assigned');
  },
  review: () => {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Awaiting internal review</div>
       <div class="view-sub">Live from "${LISTS.review.name}" — with internal reviewers before it goes to the client.</div>` +
      section('In internal review', 'var(--blue)', cache.review, 'review');
  },
  prep: () => {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Prepping / Packaging files</div>
       <div class="view-sub">Client-approved work being prepared and packaged for delivery.</div>` +
      section('Prepping files (5.1)', 'var(--purple)', cache.prep51, 'prep', 'Prepping') +
      section('Packaging files to send (5.2)', 'var(--purple)', cache.prep52, 'prep', 'Packaging');
  },
  pushed: () => {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Files pushed to client</div>
       <div class="view-sub">Live from "${LISTS.pushed.name}" — delivered.</div>` +
      section('Delivered', 'var(--muted)', cache.pushed, 'pushed');
  },
  client: () => {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Awaiting client review</div>
       <div class="view-sub">Live from "${LISTS.client.name}" — shared with the client, awaiting their approval.</div>` +
      section('With client', 'var(--red)', cache.client, 'client');
  },
};

function populateLabelOptions() {
  const names = [...new Set(Object.values(labelMap).map(l => l.name).filter(Boolean))].sort();
  document.getElementById('labelOptions').innerHTML = names.map(n => `<option value="${escapeHtml(n)}">`).join('');
}

function selectTab(view) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === view));
}

function onSearchInput(v) {
  searchQuery = v.trim();
  document.getElementById('clearSearchBtn').style.display = searchQuery ? 'inline-block' : 'none';
  // Choosing a client moves you onto the Client View tab, since results span every stage.
  currentView = 'clientsearch';
  selectTab('clientsearch');
  render();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('clientSelect').value = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  render();
}

function cardHasLabelMatch(card, query) {
  const q = query.toLowerCase();
  return (card.idLabels || []).some(id => {
    const l = labelMap[id];
    return l && l.name && l.name.toLowerCase().includes(q);
  });
}

function renderSearch() {
  if (!searchQuery) {
    document.getElementById('content').innerHTML =
      `<div class="view-title">Client View</div>
       <div class="view-sub">See every job for one client, across all pipeline stages.</div>
       <div class="empty">Select a client from the dropdown above to search.</div>`;
    return;
  }

  const q = searchQuery;
  const sections = Object.entries(ALL_LISTS).map(([key, l]) => {
    const matches = filterCards(cache[key]).filter(c => cardHasLabelMatch(c, q));
    return { key, list: l, matches };
  }).filter(s => s.matches.length);

  const total = sections.reduce((n, s) => n + s.matches.length, 0);
  const body = total
    ? sections.map(s => section(s.list.name, 'var(--purple)', s.matches, 'prep', s.list.name)).join('')
    : `<div class="empty">No jobs found for "${escapeHtml(q)}" in any active stage.</div>`;

  document.getElementById('content').innerHTML =
    `<div class="view-title">Client View: "${escapeHtml(q)}"</div>
     <div class="view-sub">Every job for this client, across all pipeline stages — ${total} found.</div>` +
    body;
}

function render() {
  if (currentView === 'clientsearch') {
    renderSearch();
  } else {
    VIEWS[currentView]();
  }
}

function setView(view, btn) {
  currentView = view;
  selectTab(view);
  if (view !== 'clientsearch') {
    // Leaving Client View clears the search so it doesn't linger on other tabs.
    searchQuery = '';
    document.getElementById('clientSelect').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
  }
  render();
}

function boot() {
  loadStaleDays();
  loadAll();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => loadAll(), REFRESH_MS);
}

boot();
</script>
</body>
</html>
